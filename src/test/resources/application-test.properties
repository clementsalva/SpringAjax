# Profil de test pour l'envoi d'emails réels

# Configuration pour Gmail via SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email d'envoi
mail.from.email=${MAIL_FROM_EMAIL:noreply@pharmacie.local}

# Configuration minimale pour les autres propriétés
spring.sql.init.data-locations=classpath:test_data.sql
spring.jpa.defer-datasource-initialization=true
logging.level.pharmacie=INFO
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
